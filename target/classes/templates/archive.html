<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div.content-wrapper}, 'Archive Logs')}">
<body>
<div class="content-wrapper">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
            <h5 class="m-0"><i class="bi bi-archive text-info me-2"></i>Archive & Analytics</h5>
            <small class="text-muted">Historical logs & compliance reports</small>
        </div>
        <button class="btn btn-outline-info btn-sm rounded-pill" onclick="exportScanLogsCSV()">
            <i class="bi bi-file-earmark-spreadsheet me-1"></i>Export CSV
        </button>
    </div>

    <!-- Analytics Stats Panel -->
    <div class="card bg-dark border-secondary p-3 mb-3">
        <h6 class="text-secondary mb-3"><i class="bi bi-bar-chart-fill me-2"></i>Patrol Performance Summary</h6>
        <div class="row g-2 text-center">
            <div class="col-4">
                <div class="p-2 bg-card rounded">
                    <small class="text-muted d-block">Compliance</small>
                    <strong class="fs-5 text-emerald" th:text="${analytics.complianceRate} + '%'">100%</strong>
                </div>
            </div>
            <div class="col-4">
                <div class="p-2 bg-card rounded">
                    <small class="text-muted d-block">On-Time</small>
                    <strong class="fs-5 text-info" th:text="${analytics.onTimeScans}">24</strong>
                </div>
            </div>
            <div class="col-4">
                <div class="p-2 bg-card rounded">
                    <small class="text-muted d-block">Incidents</small>
                    <strong class="fs-5 text-danger" th:text="${analytics.incidentScans}">0</strong>
                </div>
            </div>
        </div>
    </div>

    <!-- Archive Records List -->
    <h6 class="text-secondary mb-2"><i class="bi bi-journal-text me-2"></i>Archived Patrol Shifts</h6>
    <div class="list-group">
        <div th:each="arc : ${archives}" class="list-group-item bg-dark border-secondary text-light mb-2 rounded p-3">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h6 class="m-0 text-info fw-bold" th:text="'Archive ID: ' + ${arc.archiveId}">arc-501</h6>
                    <small class="text-muted" th:text="'Duty ID: ' + ${arc.dutyId}">duty-790</small>
                </div>
                <span class="badge bg-secondary font-monospace" th:text="${#temporals.format(arc.archivedAt, 'yyyy-MM-dd HH:mm')}">Date</span>
            </div>
            <div class="mt-2 p-2 bg-card rounded font-monospace small text-light">
                <span th:text="${arc.summaryStats}">{"complianceRate": 100}</span>
            </div>
        </div>
    </div>

</div>
</body>
</html>
