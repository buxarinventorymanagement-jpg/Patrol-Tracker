<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Outer Shield/Seal Gradient -->
    <linearGradient id="sealBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Crimson Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Polygon / Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#sealBg)" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#3b82f6" stroke-width="1"/>

  <!-- Top Curved Text Banner BG -->
  <path id="textArcTop" d="M 30,100 A 70,70 0 1,1 170,100" fill="none"/>
  <path id="textArcBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>

  <!-- Stars on Sides -->
  <path d="M 24 100 L 26 95 L 31 95 L 27 92 L 29 87 L 24 90 L 19 87 L 21 92 L 17 95 L 22 95 Z" fill="url(#goldGrad)"/>
  <path d="M 176 100 L 178 95 L 183 95 L 179 92 L 181 87 L 176 90 L 171 87 L 173 92 L 169 95 L 174 95 Z" fill="url(#goldGrad)"/>

  <!-- Circular Hindi & English Text -->
  <text font-family="'Inter', sans-serif" font-size="12.5" font-weight="bold" fill="url(#goldGrad)" letter-spacing="2">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      BIHAR POLICE
    </textPath>
  </text>
  
  <text font-family="'Inter', sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" letter-spacing="1.5">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      • बिहार पुलिस •
    </textPath>
  </text>

  <!-- Central Crest Inner Circle -->
  <circle cx="100" cy="100" r="54" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.6"/>

  <!-- Ashoka Lions Emblem / Stupa Stylized Icon -->
  <g transform="translate(100, 96) scale(0.95)">
    <!-- Base Abacus -->
    <rect x="-24" y="24" width="48" height="6" rx="2" fill="url(#goldGrad)"/>
    <rect x="-28" y="30" width="56" height="5" rx="1.5" fill="url(#goldGrad)"/>
    <circle cx="0" cy="27" r="2.5" fill="#991b1b"/>
    <circle cx="-14" cy="27" r="2" fill="#991b1b"/>
    <circle cx="14" cy="27" r="2" fill="#991b1b"/>

    <!-- Ashoka Chakra Center Wheel -->
    <circle cx="0" cy="27" r="4" fill="none" stroke="#ffffff" stroke-width="1"/>

    <!-- Central Lion Crown / Capital Silhouette -->
    <!-- Center Lion -->
    <path d="M 0 -32 C -8 -32 -10 -22 -10 -15 C -12 -12 -12 -5 -8 2 C -6 6 -4 14 -4 24 L 4 24 C 4 14 6 6 8 2 C 12 -5 12 -12 10 -15 C 10 -22 8 -32 0 -32 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
    <!-- Left Lion Profile -->
    <path d="M -8 -26 C -16 -24 -20 -15 -18 -8 C -16 -3 -14 4 -12 12 L -5 14 C -7 6 -9 -2 -11 -7 C -12 -12 -10 -20 -4 -22 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Right Lion Profile -->
    <path d="M 8 -26 C 16 -24 20 -15 18 -8 C 16 -3 14 4 12 12 L 5 14 C 7 6 9 -2 11 -7 C 12 -12 10 -20 4 -22 Z" fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Lion Eyes & Mane Detail Lines -->
    <circle cx="-3" cy="-22" r="1.2" fill="#78350f"/>
    <circle cx="3" cy="-22" r="1.2" fill="#78350f"/>
    <path d="M -4 -16 Q 0 -14 4 -16" stroke="#78350f" stroke-width="1.2" fill="none"/>
    <path d="M -6 -8 Q 0 -5 6 -8" stroke="#78350f" stroke-width="1" fill="none"/>
    <path d="M -5 2 Q 0 5 5 2" stroke="#78350f" stroke-width="1" fill="none"/>
  </g>

  <!-- Bottom Ribbon Banner: BUXAR DISTRICT -->
  <g transform="translate(100, 168)">
    <path d="M -55 -10 L 55 -10 L 45 10 L -45 10 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1"/>
    <path d="M -55 -10 L -65 -2 L -55 6 L -45 10 Z" fill="#ca8a04"/>
    <path d="M 55 -10 L 65 -2 L 55 6 L 45 10 Z" fill="#ca8a04"/>
    <text x="0" y="3" font-family="'Inter', sans-serif" font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">
      BUXAR POLICE
    </text>
  </g>
</svg>
