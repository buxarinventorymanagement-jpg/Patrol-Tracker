<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Outer Ring Gradient -->
    <linearGradient id="navyRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Rich Gold Gradient -->
    <linearGradient id="richGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff08b"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Inner Red Shield Gradient -->
    <linearGradient id="crimsonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Drop Shadows and Glows -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring Shield Base -->
  <circle cx="150" cy="150" r="142" fill="url(#navyRing)" stroke="url(#richGold)" stroke-width="7"/>
  <circle cx="150" cy="150" r="130" fill="none" stroke="url(#richGold)" stroke-width="2" stroke-dasharray="6 3"/>
  <circle cx="150" cy="150" r="122" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Text Arc Paths -->
  <path id="arcTop" d="M 42,150 A 108,108 0 1,1 258,150" fill="none"/>
  <path id="arcBottom" d="M 258,150 A 108,108 0 0,1 42,150" fill="none"/>

  <!-- Outer Text: BIHAR POLICE (English Top) -->
  <text font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="900" fill="url(#richGold)" letter-spacing="3" filter="url(#goldGlow)">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">
      BIHAR POLICE
    </textPath>
  </text>

  <!-- Outer Text: बिहार पुलिस (Hindi Bottom) -->
  <text font-family="'Inter', sans-serif" font-size="21" font-weight="bold" fill="url(#richGold)" letter-spacing="2" filter="url(#goldGlow)">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">
      • बिहार पुलिस •
    </textPath>
  </text>

  <!-- Side Decorative Stars -->
  <g fill="url(#richGold)">
    <!-- Left Star -->
    <polygon points="34,150 38,141 47,141 40,136 43,127 34,132 25,127 28,136 21,141 30,141"/>
    <!-- Right Star -->
    <polygon points="266,150 270,141 279,141 272,136 275,127 266,132 257,127 260,136 253,141 262,141"/>
  </g>

  <!-- Inner Red Circular Shield -->
  <circle cx="150" cy="150" r="84" fill="url(#crimsonBg)" stroke="url(#richGold)" stroke-width="4.5"/>
  <circle cx="150" cy="150" r="78" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.6"/>

  <!-- OFFICIAL BIHAR STATE EMBLEM: MAHABODHI TREE & SWASTIKAS -->
  <g transform="translate(150, 142)">
    <!-- Base Altar / Pedestal -->
    <path d="M -42 42 L 42 42 L 36 48 L -36 48 Z" fill="url(#richGold)"/>
    <rect x="-34" y="32" width="68" height="10" rx="2" fill="url(#richGold)"/>
    <rect x="-40" y="48" width="80" height="6" rx="2" fill="url(#richGold)"/>

    <!-- Left Swastika (Traditional Bihar State Seal Emblem) -->
    <g transform="translate(-48, 12) scale(0.65)" fill="url(#richGold)">
      <path d="M -12 -12 H 0 V 0 H 12 V 12 H 0 V 0 H -12 V -12 Z M 0 -12 V -20 H 12 V -12 Z M 12 0 H 20 V 12 H 12 Z M 0 12 V 20 H -12 V 12 Z M -12 0 H -20 V -12 H -12 Z"/>
    </g>

    <!-- Right Swastika (Traditional Bihar State Seal Emblem) -->
    <g transform="translate(48, 12) scale(0.65)" fill="url(#richGold)">
      <path d="M -12 -12 H 0 V 0 H 12 V 12 H 0 V 0 H -12 V -12 Z M 0 -12 V -20 H 12 V -12 Z M 12 0 H 20 V 12 H 12 Z M 0 12 V 20 H -12 V 12 Z M -12 0 H -20 V -12 H -12 Z"/>
    </g>

    <!-- Mahabodhi Tree Trunk -->
    <path d="M -7 32 C -5 18 -10 4 -12 -8 C -14 -18 -6 -35 0 -44 C 6 -35 14 -18 12 -8 C 10 4 5 18 7 32 Z" fill="url(#richGold)"/>

    <!-- Main Tree Branches -->
    <path d="M 0 -20 Q -25 -28 -38 -15 Q -22 -12 0 -14 Z" fill="url(#richGold)"/>
    <path d="M 0 -20 Q 25 -28 38 -15 Q 22 -12 0 -14 Z" fill="url(#richGold)"/>
    <path d="M 0 -30 Q -28 -42 -44 -28 Q -24 -22 0 -22 Z" fill="url(#richGold)"/>
    <path d="M 0 -30 Q 28 -42 44 -28 Q 24 -22 0 -22 Z" fill="url(#richGold)"/>

    <!-- Bodhi Leaves Canopy (Intricate Peepal Leaves Silhouette) -->
    <!-- Top Central Leaf -->
    <path d="M 0 -62 C -6 -50 0 -42 0 -42 C 0 -42 6 -50 0 -62 Z" fill="url(#richGold)"/>
    <!-- Top Left Leaves -->
    <path d="M -14 -54 C -22 -44 -14 -36 -14 -36 C -14 -36 -6 -44 -14 -54 Z" fill="url(#richGold)"/>
    <path d="M -28 -44 C -38 -34 -28 -26 -28 -26 C -28 -26 -18 -34 -28 -44 Z" fill="url(#richGold)"/>
    <path d="M -40 -30 C -52 -20 -40 -12 -40 -12 C -40 -12 -28 -20 -40 -30 Z" fill="url(#richGold)"/>
    <path d="M -48 -14 C -60 -4 -48 4 -48 4 C -48 4 -36 -4 -48 -14 Z" fill="url(#richGold)"/>
    
    <!-- Top Right Leaves -->
    <path d="M 14 -54 C 22 -44 14 -36 14 -36 C 14 -36 6 -44 14 -54 Z" fill="url(#richGold)"/>
    <path d="M 28 -44 C 38 -34 28 -26 28 -26 C 28 -26 18 -34 28 -44 Z" fill="url(#richGold)"/>
    <path d="M 40 -30 C 52 -20 40 -12 40 -12 C 40 -12 28 -20 40 -30 Z" fill="url(#richGold)"/>
    <path d="M 48 -14 C 60 -4 48 4 48 4 C 48 4 36 -4 48 -14 Z" fill="url(#richGold)"/>
  </g>

  <!-- Bottom Gold Banner Ribbon: BUXAR POLICE -->
  <g transform="translate(150, 248)">
    <path d="M -85 -14 L 85 -14 L 70 14 L -70 14 Z" fill="url(#richGold)" stroke="#78350f" stroke-width="1.5"/>
    <path d="M -85 -14 L -100 -2 L -85 10 L -70 14 Z" fill="#b45309"/>
    <path d="M 85 -14 L 100 -2 L 85 10 L 70 14 Z" fill="#b45309"/>
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#020617" text-anchor="middle" letter-spacing="2.5">
      BUXAR POLICE
    </text>
  </g>
</svg>
