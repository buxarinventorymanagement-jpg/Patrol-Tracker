<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <defs>
    <!-- Deep Navy Shield Gradient -->
    <linearGradient id="shieldNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2558"/>
      <stop offset="60%" stop-color="#05173d"/>
      <stop offset="100%" stop-color="#020b24"/>
    </linearGradient>

    <!-- Bright Gold Yellow Fill Gradient for Tree, Text & Waves -->
    <linearGradient id="goldYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Subtle Outer Border Stroke -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Official Bihar Police Arched Shield Base Shape -->
  <!-- Arched Top with 3 Crest Points, Vertical Sides, V-Pointed Bottom -->
  <path d="M 120,4 C 150,22 190,26 230,8 L 230,195 C 230,230 175,264 120,276 C 65,264 10,230 10,195 L 10,8 C 50,26 90,22 120,4 Z" fill="url(#shieldNavy)" stroke="url(#shieldBorder)" stroke-width="4.5"/>
  <path d="M 120,12 C 148,27 186,31 222,15 L 222,192 C 222,223 172,254 120,265 C 68,254 18,223 18,192 L 18,15 C 54,31 92,27 120,12 Z" fill="none" stroke="url(#goldYellow)" stroke-width="1.5" opacity="0.4"/>

  <!-- Golden Banyan Tree (वटवृक्ष) with Prop Roots -->
  <g transform="translate(120, 95)" fill="url(#goldYellow)" filter="url(#goldGlow)">
    <!-- Tree Canopy (Broad Rounded Dome) -->
    <path d="M 0 -68 C -45 -68 -72 -48 -70 -26 C -70 -10 -55 -4 -42 -6 C -32 -20 -15 -25 0 -25 C 15 -25 32 -20 42 -6 C 55 -4 70 -10 70 -26 C 72 -48 45 -68 0 -68 Z"/>

    <!-- Canopy Leaf Texture Highlights -->
    <circle cx="-35" cy="-45" r="4" fill="#05173d" opacity="0.3"/>
    <circle cx="-15" cy="-52" r="5" fill="#05173d" opacity="0.3"/>
    <circle cx="15" cy="-52" r="5" fill="#05173d" opacity="0.3"/>
    <circle cx="35" cy="-45" r="4" fill="#05173d" opacity="0.3"/>
    <circle cx="0" cy="-40" r="6" fill="#05173d" opacity="0.3"/>

    <!-- Main Tree Trunk & Thick Branches -->
    <path d="M -8 -22 C -6 -10 -14 6 -20 18 L -12 18 C -7 8 -3 -4 -4 -22 Z"/>
    <path d="M 8 -22 C 6 -10 14 6 20 18 L 12 18 C 7 8 3 -4 4 -22 Z"/>
    <path d="M 0 -22 L -3 18 L 3 18 Z"/>

    <!-- Hanging Prop Roots (बरगद की जटाएं) -->
    <line x1="-50" y1="-12" x2="-48" y2="18" stroke="url(#goldYellow)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-36" y1="-18" x2="-34" y2="18" stroke="url(#goldYellow)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-25" y1="-20" x2="-25" y2="18" stroke="url(#goldYellow)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="-20" x2="25" y2="18" stroke="url(#goldYellow)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="36" y1="-18" x2="34" y2="18" stroke="url(#goldYellow)" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="-12" x2="48" y2="18" stroke="url(#goldYellow)" stroke-width="3" stroke-linecap="round"/>

    <!-- Root Base Stand Line -->
    <path d="M -58 18 Q 0 14 58 18 Q 0 22 -58 18 Z"/>
  </g>

  <!-- Official Hindi Typography: बिहार पुलिस -->
  <text x="120" y="152" font-family="'Inter', 'Noto Sans Devanagari', 'Kohinoor Devanagari', sans-serif" font-size="28" font-weight="900" fill="url(#goldYellow)" text-anchor="middle" letter-spacing="1" filter="url(#goldGlow)">
    बिहार पुलिस
  </text>

  <!-- 5 Wavy River Lines (पाँच तरंगित रेखाएं) -->
  <g stroke="url(#goldYellow)" stroke-width="4.5" stroke-linecap="round" fill="none" transform="translate(0, 162)">
    <path d="M 46,12 Q 83,2 120,12 T 194,12"/>
    <path d="M 52,24 Q 86,14 120,24 T 188,24"/>
    <path d="M 60,36 Q 90,26 120,36 T 180,36"/>
    <path d="M 70,48 Q 95,38 120,48 T 170,48"/>
    <path d="M 82,60 Q 101,50 120,60 T 158,60"/>
  </g>
</svg>
