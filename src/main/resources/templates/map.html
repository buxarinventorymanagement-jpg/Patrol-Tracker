<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div.content-wrapper}, 'Map Location')}">
<body>
<div class="content-wrapper">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
            <h5 class="m-0"><i class="bi bi-geo-alt text-info me-2"></i>Live Checkpoint Map</h5>
            <small class="text-muted">Real-time GPS verification & scan status</small>
        </div>
        <span class="badge bg-success"><i class="bi bi-broadcast me-1"></i>Live Radar</span>
    </div>

    <!-- Map Color Legend -->
    <div class="d-flex gap-2 mb-2 p-2 bg-dark rounded border border-secondary small text-light justify-content-around">
        <div><i class="bi bi-circle-fill text-success me-1"></i><strong class="text-emerald">GREEN</strong>: Scanned Checkpoint</div>
        <div><i class="bi bi-circle-fill text-warning me-1"></i><strong class="text-warning">AMBER</strong>: Pending Inspection</div>
    </div>

    <!-- Leaflet Map Container -->
    <div id="patrol-map"></div>

    <!-- Checkpoint Pins Legend & Status -->
    <h6 class="text-secondary mb-2"><i class="bi bi-pin-map-fill me-2"></i>Checkpoints Verification Feed</h6>
    <div class="list-group">
        <div th:each="chk : ${checkpoints}" class="list-group-item bg-dark border-secondary text-light d-flex justify-content-between align-items-center mb-2 rounded">
            <div>
                <div class="d-flex align-items-center gap-2">
                    <strong th:text="${chk.name}">Main Gate Entrance</strong>
                    <span class="badge bg-success" style="font-size:0.65rem;"><i class="bi bi-check-all me-1"></i>VERIFIED GREEN</span>
                </div>
                <div class="small text-muted font-monospace" th:text="${chk.latitude} + ', ' + ${chk.longitude}">25.564700, 83.977700</div>
            </div>
            <span class="badge bg-info text-dark font-monospace" th:text="${chk.qrCodeData}">QR-CODE</span>
        </div>
    </div>

</div>
</body>
</html>
