<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Patrol Tracker</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <script>
      (function() {
        const theme = localStorage.getItem('patrol_theme') || 'dark';
        if (theme === 'light') {
          document.documentElement.classList.add('theme-light');
          document.addEventListener('DOMContentLoaded', () => document.body.classList.add('theme-light'));
        }
      })();
    </script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="app-viewport style-login p-4 rounded-4 shadow-lg border border-secondary position-relative" style="max-width: 440px; width: 100%;">
        
        <!-- Top Theme Switcher Button on Login Card -->
        <div class="d-flex justify-content-end mb-2">
            <button type="button" class="btn-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Switch Light / Dark Mode Theme">
                <i class="bi bi-sun-fill me-1 text-warning"></i>
                <span>Light Mode</span>
            </button>
        </div>

        <div class="text-center mb-4">
            <img th:src="@{/images/bihar-police-logo.svg}" alt="Bihar Police Logo" class="police-logo-img mb-2" style="width: 72px; height: 72px;">
            <h4 class="fw-bold m-0 text-primary">BUXAR POLICE, BIHAR</h4>
            <div class="small fw-bold text-info mb-1">बिहार पुलिस — बक्सर, बिहार</div>
            <small class="text-muted d-block">PATROL TRACKER PORTAL</small>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2 px-3 small text-center mb-3" th:text="${error}">
            Invalid Credentials!
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small text-muted">User ID / Name / Mobile / Badge</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                    <input type="text" id="loginUserId" name="userId" class="form-control" placeholder="Enter User ID, Name, or Badge..." required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key"></i></span>
                    <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter password..." required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 font-weight-bold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>

        <!-- Quick Demo Credentials -->
        <div class="mt-4 pt-3 border-top border-secondary text-center">
            <small class="text-muted d-block mb-2">Quick Demo One-Tap Login:</small>
            <div class="d-flex flex-column gap-2">
                <button class="btn btn-outline-danger btn-sm" onclick="setLogin('Patrol Tracker', 'BXRadmin123')">
                    👑 Login as Patrol Duty Monitor (Patrol Tracker / BXRadmin123)
                </button>
                <button class="btn btn-outline-warning btn-sm" onclick="setLogin('usr-003', 'super123')">
                    👮 Login as Station In-Charge (usr-003)
                </button>
                <button class="btn btn-outline-info btn-sm" onclick="setLogin('usr-001', 'guard123')">
                    🛡️ Login as Patrol Guard A (usr-001)
                </button>
            </div>
        </div>
    </div>

<script th:src="@{/js/app.js}"></script>
<script>
function setLogin(id, pwd) {
  document.getElementById('loginUserId').value = id;
  document.getElementById('loginPassword').value = pwd;
  const form = document.querySelector('form');
  if (form) form.submit();
}
</script>
</body>
</html>
