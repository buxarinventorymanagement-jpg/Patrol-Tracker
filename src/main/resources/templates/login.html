<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Patrol Tracker</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="app-viewport style-login p-4 rounded-4 shadow-lg border border-secondary" style="max-width: 420px; width: 100%;">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-2" style="width: 56px; height: 56px; font-size: 1.8rem;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h4 class="fw-bold m-0 text-light">PATROL TRACKER</h4>
            <small class="text-muted">Security Guard Inspection & Dispatch System</small>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2 px-3 small text-center mb-3" th:text="${error}">
            Invalid Credentials!
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small text-muted">User ID / Badge Number</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                    <input type="text" id="loginUserId" name="userId" class="form-control" placeholder="e.g. Patrol Tracker or usr-001" required value="Patrol Tracker">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key"></i></span>
                    <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter password..." required value="BXRadmin123">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 font-weight-bold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>

        <!-- Quick Demo Credentials -->
        <div class="mt-4 pt-3 border-top border-secondary text-center">
            <small class="text-muted d-block mb-2">Quick Demo One-Tap Login:</small>
            <div class="d-flex flex-column gap-2">
                <button class="btn btn-outline-danger btn-sm" onclick="setLogin('Patrol Tracker', 'BXRadmin123')">
                    👑 Login as Patrol Duty Monitor (Patrol Tracker / BXRadmin123)
                </button>
                <button class="btn btn-outline-warning btn-sm" onclick="setLogin('usr-003', 'super123')">
                    👮 Login as Station In-Charge (usr-003)
                </button>
                <button class="btn btn-outline-info btn-sm" onclick="setLogin('usr-001', 'guard123')">
                    🛡️ Login as Patrol Guard A (usr-001)
                </button>
            </div>
        </div>
    </div>

<script>
function setLogin(id, pwd) {
  document.getElementById('loginUserId').value = id;
  document.getElementById('loginPassword').value = pwd;
}
</script>
</body>
</html>
