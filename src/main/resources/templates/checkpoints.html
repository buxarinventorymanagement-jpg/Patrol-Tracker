<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div.content-wrapper}, 'Checkpoints')}">
<body>
<div class="content-wrapper">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
            <h5 class="m-0"><i class="bi bi-pin-map text-info me-2"></i>Patrol Checkpoints</h5>
            <small class="text-muted">Registered inspection locations & QR codes</small>
        </div>
        <button class="btn btn-primary btn-sm rounded-pill" data-bs-toggle="modal" data-bs-target="#newCheckpointModal">
            <i class="bi bi-plus-lg me-1"></i>Add Point
        </button>
    </div>

    <!-- Checkpoint Cards -->
    <div class="row g-3">
        <div th:each="chk : ${checkpoints}" class="col-12">
            <div class="card bg-dark border-secondary p-3">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h6 class="m-0 text-light fw-bold" th:text="${chk.name}">Main Gate Entrance</h6>
                        <span class="badge bg-secondary mt-1 font-monospace" th:text="${chk.checkpointId}">chk-101</span>
                    </div>
                    <button class="btn btn-outline-info btn-sm" 
                            th:data-qr="${chk.qrCodeData}" 
                            th:data-name="${chk.name}" 
                            onclick="showQRModalFromBtn(this)">
                        <i class="bi bi-qr-code me-1"></i>QR Code
                    </button>
                </div>
                <div class="small text-muted mt-2">
                    <div><i class="bi bi-key me-1"></i><strong>QR Data:</strong> <code class="text-info" th:text="${chk.qrCodeData}">QR-DATA</code></div>
                    <div><i class="bi bi-clock-history me-1"></i><strong>Scan Window:</strong> <span th:text="${chk.scanIntervalMinutes} + ' mins'">60 mins</span></div>
                    <div th:if="${chk.instructions != null}"><i class="bi bi-info-circle me-1"></i><span th:text="${chk.instructions}">Instructions</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- QR Code Preview Modal -->
    <div class="modal fade" id="qrPreviewModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered text-center">
            <div class="modal-content">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="qrModalTitle">Checkpoint QR Code</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-4">
                    <div id="qrModalCanvas" class="d-flex justify-content-center mb-3"></div>
                    <code id="qrModalText" class="fs-5 text-info">QR-DATA</code>
                    <p class="small text-muted mt-2">Print or display this QR code at the physical checkpoint station.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- New Checkpoint Modal -->
    <div class="modal fade" id="newCheckpointModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="checkpointForm" onsubmit="event.preventDefault(); saveCheckpoint(); return false;">
                    <div class="modal-header border-secondary">
                        <h5 class="modal-title"><i class="bi bi-pin-map me-2 text-info"></i>Add Patrol Checkpoint</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small text-muted">Checkpoint Name</label>
                            <input type="text" id="chkName" class="form-control" placeholder="e.g. Roof East Tower" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">QR Code Data String</label>
                            <input type="text" id="chkQr" class="form-control" placeholder="e.g. QR-ROOF-EAST-106">
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small text-muted">Latitude</label>
                                <input type="number" step="0.000001" id="chkLat" class="form-control" value="25.564700">
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-muted">Longitude</label>
                                <input type="number" step="0.000001" id="chkLng" class="form-control" value="83.977700">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Scan Interval (Minutes)</label>
                            <input type="number" id="chkInterval" class="form-control" value="60">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Inspection Instructions</label>
                            <textarea id="chkInstructions" class="form-control" rows="2" placeholder="e.g. Verify locks and fire doors..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="chkSubmitBtn" class="btn btn-primary btn-sm">Save Checkpoint</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

<!-- QR Code Generator script -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script th:inline="javascript">
let qrcodeObj = null;

function showQRModalFromBtn(btn) {
  const qrData = btn.getAttribute('data-qr');
  const name = btn.getAttribute('data-name');
  showQRModal(qrData, name);
}

function showQRModal(qrData, name) {
  document.getElementById('qrModalTitle').innerText = name;
  document.getElementById('qrModalText').innerText = qrData;
  const canvasDiv = document.getElementById('qrModalCanvas');
  canvasDiv.innerHTML = '';

  qrcodeObj = new QRCode(canvasDiv, {
    text: qrData,
    width: 180,
    height: 180,
    colorDark : "#ffffff",
    colorLight : "#151c2c",
    correctLevel : QRCode.CorrectLevel.H
  });

  const modal = new bootstrap.Modal(document.getElementById('qrPreviewModal'));
  modal.show();
}

function saveCheckpoint() {
  const name = document.getElementById('chkName').value.trim();
  const qrCodeData = document.getElementById('chkQr').value.trim();
  const lat = document.getElementById('chkLat').value;
  const lng = document.getElementById('chkLng').value;
  const interval = document.getElementById('chkInterval').value;
  const instructions = document.getElementById('chkInstructions').value.trim();

  if (!name || !qrCodeData || !lat || !lng) {
    alert('Please complete all required fields (Name, QR Code Data, Latitude, Longitude)!');
    return;
  }

  fetch('/api/checkpoints', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: name,
      qrCodeData: qrCodeData,
      latitude: lat,
      longitude: lng,
      scanIntervalMinutes: interval || 30,
      instructions: instructions
    })
  }).then(res => {
    if (!res.ok) {
      return res.text().then(text => { throw new Error(text || 'Server error saving checkpoint'); });
    }
    return res.json();
  }).then(data => {
    alert('✓ CHECKPOINT SAVED SUCCESSFULLY!\nName: ' + name + '\nQR Code: ' + qrCodeData);
    location.reload();
  }).catch(err => {
    alert('❌ ERROR SAVING CHECKPOINT: ' + err.message);
  });
}
</script>
</body>
</html>
