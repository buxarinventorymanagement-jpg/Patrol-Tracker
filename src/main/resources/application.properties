# Spring Application Config
spring.application.name=patrol-tracker
server.port=8080

# Database Configuration (Supabase PostgreSQL / Fallback H2)
# To connect to your Supabase PostgreSQL Database, set environment variables:
# SUPABASE_DB_URL=jdbc:postgresql://db.YOUR_SUPABASE_ID.supabase.co:5432/postgres
# SUPABASE_DB_USER=postgres
# SUPABASE_DB_PASSWORD=YOUR_PASSWORD

spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:patroldb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SUPABASE_DB_USER:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=${SUPABASE_DB_DRIVER:org.h2.Driver}

# JPA & Hibernate Settings
spring.jpa.database-platform=${SUPABASE_DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-supabase.sql
spring.sql.init.continue-on-error=true

# Thymeleaf Template Cache (disable in dev)
spring.thymeleaf.cache=false

# H2 Console (available at /h2-console for local inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
