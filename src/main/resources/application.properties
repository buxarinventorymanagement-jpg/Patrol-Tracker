# Spring Application Config
spring.application.name=patrol-tracker
server.port=8080

# Database Configuration (Supabase PostgreSQL or fallback to Local Persistent H2 Database)
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:file:./data/patroldb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SUPABASE_DB_USER:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=${SUPABASE_DB_DRIVER:org.h2.Driver}

# HikariCP Connection Pool (Optimized for Fast Connection & Local Failover)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=15000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

# JPA & Hibernate Settings (Auto-detects dialect for H2 or PostgreSQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-supabase.sql
spring.sql.init.continue-on-error=true

# Thymeleaf Template Cache
spring.thymeleaf.cache=false